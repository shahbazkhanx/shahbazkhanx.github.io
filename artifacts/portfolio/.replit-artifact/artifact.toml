kind = "web"
previewPath = "/"
title = "Shahbaz Khan Portfolio"
description = "A high-quality personal portfolio website for Shahbaz Khan, a senior web developer with 7+ years of experience. Showcases skills, work history, projects, and contact info to impress recruiters and potential clients."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
